<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Library (Hybrid)</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; padding:20px; background:#f9f9f9; }
    header { text-align:center; margin-bottom:30px; }
    h1 { margin:0; }
    .song { background:#fff; padding:20px; margin-bottom:30px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
    .song h2 { margin-top:0; }
    input[type="text"] { padding:8px; width:80%; font-size:14px; margin:10px 0; }
    button { margin:5px; padding:8px 15px; font-size:14px; cursor:pointer; }
    .lyrics { white-space:pre-wrap; font-size:16px; line-height:1.6; }
    .chord { font-weight:bold; color:#2a5; }
  </style>
</head>
<body>
  <header>
    <h1>🎸 My Song Library</h1>
    <p>Search your songs or fetch new ones from Songsterr</p>
    <input type="text" id="globalSearch" placeholder="Search song..." onkeyup="searchSong()">
  </header>

  <div id="songs"></div>

  <script>
    // Local songs
    const localSongs = [
      {
        title: "Amazing Grace",
        lyrics: `[<span class="chord">C</span>] Amazing grace, how sweet the sound  
That saved a wretch like me  
[<span class="chord">F</span>] I once was lost, but now am found  
[<span class="chord">C</span>] Was blind, but now I see`
      },
      {
        title: "Sample Song",
        lyrics: `[<span class="chord">G</span>] This is a sample line  
[<span class="chord">D</span>] Another chorded lyric  
[<span class="chord">Em</span>] Keep adding your own songs here`
      },
      {
        title: "Song Three",
        lyrics: `[<span class="chord">Am</span>] Example lyrics line  
[<span class="chord">F</span>] Another chord line`
      },
      {
        title: "Song Four",
        lyrics: `[<span class="chord">E</span>] Example lyric line  
[<span class="chord">B</span>] Another chord line`
      },
      {
        title: "Song Five",
        lyrics: `[<span class="chord">D</span>] Example lyric line  
[<span class="chord">A</span>] Another chord line`
      }
    ];

    const chords = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];

    function renderSongs(list) {
      const container = document.getElementById("songs");
      container.innerHTML = "";
      list.forEach((song, index) => {
        const songDiv = document.createElement("div");
        songDiv.className = "song";
        songDiv.id = "song" + index;
        songDiv.innerHTML = `
          <h2>${song.title}</h2>
          <input type="text" placeholder="Search within lyrics..." onkeyup="filterLyrics('song${index}', this.value)">
          <br>
          <button onclick="transpose('song${index}', 1)">Transpose Up</button>
          <button onclick="transpose('song${index}', -1)">Transpose Down</button>
          <div class="lyrics">${song.lyrics || ""}</div>`;
        container.appendChild(songDiv);
      });
    }

    // Initial render
    renderSongs(localSongs);

    function transpose(songId, step) {
      const lyricsEl = document.querySelector(`#${songId} .lyrics`);
      lyricsEl.innerHTML = lyricsEl.innerHTML.replace(/<span class="chord">(.*?)<\/span>/g, (match, chord) => {
        let base = chord.replace(/m|maj7|sus4|dim|7/g,"");
        let modifier = chord.slice(base.length);
        let idx = chords.indexOf(base);
        if (idx === -1) return chord;
        let newIdx = (idx + step + chords.length) % chords.length;
        return `<span class="chord">${chords[newIdx]}${modifier}</span>`;
      });
    }

    function filterLyrics(songId, query) {
      const lyricsEl = document.querySelector(`#${songId} .lyrics`);
      const lines = lyricsEl.textContent.split("\n");
      lyricsEl.innerHTML = lines
        .filter(line => line.toLowerCase().includes(query.toLowerCase()))
        .map(line => line.replace(/

\[(.*?)\]

/g, '<span class="chord">$1</span>'))
        .join("\n");
    }

    async function searchSong() {
      const query = document.getElementById("globalSearch").value.toLowerCase();
      if (!query) { renderSongs(localSongs); return; }

      // First check local songs
      const filtered = localSongs.filter(song => song.title.toLowerCase().includes(query));
      if (filtered.length > 0) {
        renderSongs(filtered);
        return;
      }

      // If not found locally, query Songsterr API
      const response = await fetch(`https://www.songsterr.com/a/ra/songs.json?pattern=${encodeURIComponent(query)}`);
      const data = await response.json();
      const container = document.getElementById("songs");
      container.innerHTML = "";
      data.forEach(song => {
        const songDiv = document.createElement("div");
        songDiv.className = "song";
        songDiv.innerHTML = `<h2>${song.title} — ${song.artist.name}</h2>
          <p>Tab available on Songsterr</p>
          <a href="https://www.songsterr.com/a/wsa/${song.title}-tab-s${song.id}" target="_blank">View Tab</a>`;
        container.appendChild(songDiv);
      });
    }
  </script>
</body>
</html>
